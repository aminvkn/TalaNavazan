name: Build TalaNavazan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project and fix settings
        run: |
          unzip -o TalaNavazan-v8.zip -d .

          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) \
            -exec sed -i \
            -e 's/VERSION_1_8/VERSION_17/g' \
            -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
            {} +

          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'app/src/main/AndroidManifest.xml'
          android_ns = 'http://schemas.android.com/apk/res/android'

          ET.register_namespace('android', android_ns)
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find('application')

          if app is None:
              raise RuntimeError('Application section not found')

          app.set('{' + android_ns + '}label', 'نوسان گیر طلا و بورس')

          tree.write(
              path,
              encoding='utf-8',
              xml_declaration=True
          )
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NosanGireTalaVaBourse-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
